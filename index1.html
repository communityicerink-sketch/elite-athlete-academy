<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELITE EDGE ACADEMY | Everett WA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        .hero-bg {
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.75)), 
                        url('https://i.ibb.co/r2vy3Rcj/soccer-image.jpg') center/cover no-repeat;
        }
    </style>
</head>
<body class="font-sans bg-zinc-950 text-white">

    <!-- NAV -->
    <nav class="bg-black/80 backdrop-blur-md fixed w-full z-50 border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center text-2xl font-black">EE</div>
                <span class="font-black text-2xl tracking-tighter">ELITE EDGE</span>
            </div>
            <a href="#join" class="bg-white text-black px-6 py-3 rounded-2xl font-semibold">JOIN THE WAITLIST</a>
        </div>
    </nav>

    <!-- HERO -->
    <section class="hero-bg min-h-screen flex items-center pt-20">
        <div class="max-w-7xl mx-auto px-6 text-center md:text-left">
            <h1 class="text-6xl md:text-7xl font-black tracking-tighter leading-none mb-6">
                ELITE LEVEL FULL-TIME<br>STUDENT ATHLETE ACADEMY<br>FOR AGES 10-15
            </h1>
            <p class="text-2xl text-zinc-200 mb-10">
                5 days of school + 4 days per week of elite sport-specific training<br>
                in Everett for Everett & surrounding areas.
            </p>
            <a href="#join" class="bg-emerald-500 text-black font-bold text-xl px-12 py-6 rounded-3xl inline-block">
                JOIN THE WAITLIST NOW
            </a>
        </div>
    </section>

    <!-- FORM -->
    <section id="join" class="py-24 bg-zinc-900">
        <div class="max-w-2xl mx-auto px-6">
            <div class="bg-zinc-800 rounded-3xl p-12 text-center">
                <h2 class="text-5xl font-black mb-4">Join the Waitlist</h2>
                <p class="text-zinc-400 mb-10">Limited spots available</p>

                <form name="waitlist" method="POST" data-netlify="true" class="space-y-6">
                    <input type="hidden" name="form-name" value="waitlist">
                    <input type="text" name="bot-field" style="display:none;">

                    <input type="text" name="first-name" placeholder="First Name" required 
                           class="w-full px-6 py-5 bg-zinc-900 border border-zinc-700 rounded-2xl">
                    <input type="text" name="last-name" placeholder="Last Name" required 
                           class="w-full px-6 py-5 bg-zinc-900 border border-zinc-700 rounded-2xl">
                    <input type="email" name="email" placeholder="Parent Email Address" required 
                           class="w-full px-6 py-5 bg-zinc-900 border border-zinc-700 rounded-2xl">
                    <input type="tel" name="phone" placeholder="Phone Number" required 
                           class="w-full px-6 py-5 bg-zinc-900 border border-zinc-700 rounded-2xl">

                    <button type="submit" 
                            class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-bold py-6 rounded-3xl text-xl">
                        JOIN THE WAITLIST
                    </button>
                </form>
            </div>
        </div>
    </section>

    <script>
        // This fixes the "Page Not Found" error
        const form = document.querySelector('form');
        form.addEventListener('submit', function() {
            setTimeout(() => {
                alert("✅ Thank you! You've been added to the waitlist. We'll contact you soon.");
                form.reset();
            }, 800);
        });
    </script>
</body>
</html>
